name: macOS source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-tests:
    concurrency:
      group: clipperline-mac-tests-${{ github.ref }}
      cancel-in-progress: false
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Shared version and parity guard tests
        run: |
          python3 scripts/check-release-version.py --require-windows
          python3 scripts/test-cross-platform-parity.py
          python3 scripts/test-mac-dev-update.py
      - name: XCTest and actual Mac shared behavior contract
        run: |
          set -o pipefail
          if swift test 2>&1 | tee "$RUNNER_TEMP/clipboardline-swift-test.log"; then
            exit 0
          fi
          # Surface bounded compiler/assertion errors in the run summary as well
          # as logs, so a failed public build is diagnosable without a login.
          python3 - "$RUNNER_TEMP/clipboardline-swift-test.log" <<'PYERRORS'
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          # Framework services can emit many unrelated "error:" messages.
          # Preserve actual assertion/compiler failures before that noise.
          errors = [line for line in lines if
                    re.search(r'\.swift:\d+(?::\d+)?: error:', line) or
                    ('Test Case' in line and 'failed' in line) or
                    any(marker in line for marker in ['failed -', 'Fatal error:',
                        'error: Exited', 'Program crashed:', 'unexpected signal'])]
          if not errors:
              errors = lines[-20:]
          for line in errors[:25]:
              escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Mac test failure::' + escaped)
          PYERRORS
          exit 1
        env:
          CLIPBOARDLINE_PARITY_REPORT: validation/parity/macos.json
      - name: Check localization
        run: swift scripts/check-strings.swift
      - name: Preserve exact-source Mac parity observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clipboardline-macos-parity-${{ github.sha }}
          path: validation/parity/macos.json
          if-no-files-found: error
          retention-days: 14
  test-and-community-build:
    concurrency:
      group: clipperline-mac-package-${{ github.ref }}
      cancel-in-progress: false
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Shared version and parity guard tests
        run: |
          python3 scripts/check-release-version.py --require-windows
          python3 scripts/test-cross-platform-parity.py
          python3 scripts/test-mac-dev-update.py
      - name: macOS 27 drop destination regression tests
        run: |
          set -o pipefail
          if swift test --filter DropShelfTests 2>&1 | tee "$RUNNER_TEMP/clipboardline-swift-test.log"; then
            exit 0
          fi
          # Surface bounded compiler/assertion errors in the run summary as well
          # as logs, so a failed public build is diagnosable without a login.
          python3 - "$RUNNER_TEMP/clipboardline-swift-test.log" <<'PYERRORS'
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          # Framework services can emit many unrelated "error:" messages.
          # Preserve actual assertion/compiler failures before that noise.
          errors = [line for line in lines if
                    re.search(r'\.swift:\d+(?::\d+)?: error:', line) or
                    ('Test Case' in line and 'failed' in line) or
                    any(marker in line for marker in ['failed -', 'Fatal error:',
                        'error: Exited', 'Program crashed:', 'unexpected signal'])]
          if not errors:
              errors = lines[-20:]
          for line in errors[:25]:
              escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Mac test failure::' + escaped)
          PYERRORS
          exit 1
      - name: Check localization
        run: swift scripts/check-strings.swift
      - name: Build isolated, keyless developer application
        run: |
          set -o pipefail
          if bash scripts/build-community.sh 2>&1 | tee "$RUNNER_TEMP/clipboardline-community-build.log"; then
            exit 0
          fi
          python3 - "$RUNNER_TEMP/clipboardline-community-build.log" <<'PYBUILD'
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          errors = [line for line in lines if re.search(r'\.swift:\d+(?::\d+)?: error:', line)]
          detail = '\n'.join((errors or lines[-25:])[:25])[:6000]
          escaped = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Mac application build failure::' + escaped)
          PYBUILD
          exit 1
        env:
          CLIPBOARDLINE_DEV_BUILD: ${{ github.sha }}
          CLIPBOARDLINE_DEV_REPOSITORY: ${{ github.repository }}
      - name: Verify developer signature
        run: codesign --verify --deep --strict "build/Clipperline.app"
      - name: Package the developer application as a disk image and archive
        run: |
          ditto -c -k --keepParent "build/Clipperline.app" "build/Clipperline.zip"
          # Updaters bundled before the rename expect the old folder name.
          # The signature does not cover it; the app moves itself on launch.
          rm -rf build/legacy && mkdir -p build/legacy
          ditto "build/Clipperline.app" "build/legacy/ClipBoardLine Dev.app"
          ditto -c -k --keepParent "build/legacy/ClipBoardLine Dev.app" "build/ClipBoardLine-Dev.zip"
          printf '%s\n' "$GITHUB_SHA" > build/ClipBoardLine-Dev-build.txt
          # hdiutil on hosted runners intermittently reports "Resource busy".
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname "Clipperline" -srcfolder "build/Clipperline.app" -ov -format UDZO "build/Clipperline.dmg"; then break; fi
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
          done
      - name: Offer the disk image for download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClipBoardLine-Dev-${{ github.sha }}
          path: |
            build/Clipperline.dmg
            build/Clipperline.zip
            build/ClipBoardLine-Dev.zip
            build/ClipBoardLine-Dev-build.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  # The keyless developer build of the latest tested main, at a fixed public
  # address for scripts/mac-dev-update.sh. A pre-release, never the Latest
  # release, so it cannot shadow an official signed release.
  publish-dev-build:
    concurrency:
      group: clipperline-developer-publication
      cancel-in-progress: false
    needs: [macos-tests, test-and-community-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ClipBoardLine-Dev-${{ github.sha }}
          path: dev
      - name: Replace the rolling dev-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::notice::A newer main revision exists; this older run will not replace developer downloads."
            exit 0
          fi
          # Keep the existing download available when GitHub rejects an upload.
          # Publish the build marker last, after all archives have been replaced.
          notes="Keyless developer build of $GITHUB_SHA after the macOS tests passed. The embedded build identity and build.txt identify the source; the rolling tag is retained. Install and update it with scripts/mac-dev-update.sh."
          publish() {
            if ! gh release view dev-latest >/dev/null 2>&1; then
              gh release create dev-latest --target "$GITHUB_SHA" --prerelease --latest=false --title "Clipperline (latest main)" --notes "$notes" || return
            fi
            gh release upload dev-latest dev/Clipperline.zip dev/Clipperline.dmg dev/ClipBoardLine-Dev.zip --clobber || return
            gh release upload dev-latest dev/ClipBoardLine-Dev-build.txt --clobber || return
            gh release edit dev-latest --prerelease --latest=false --title "Clipperline (latest main)" --notes "$notes"
          }
          for attempt in 1 2 3; do
            if publish >"$RUNNER_TEMP/dev-publish.log" 2>&1; then
              cat "$RUNNER_TEMP/dev-publish.log"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          python3 - "$RUNNER_TEMP/dev-publish.log" <<'PYPUBLISH'
          import pathlib, sys
          for line in pathlib.Path(sys.argv[1]).read_text().splitlines()[-8:]:
              print('::error title=Developer build publication::' + line.replace('%', '%25'))
          PYPUBLISH
          exit 1
